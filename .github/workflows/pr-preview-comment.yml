name: Comment browser preview

on:
  workflow_run:
    workflows: [PR browser preview]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  resolve:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      number: ${{ steps.resolve.outputs.number }}
    steps:
      # This and the comment job use ONLY trusted default-branch code.
      - name: Check out trusted handler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Resolve current PR from GitHub metadata
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: node .github/scripts/comment-preview.mjs --resolve

  comment:
    needs: resolve
    if: needs.resolve.result == 'success' && needs.resolve.outputs.number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      pull-requests: write
    # Serialize all revisions of this verified PR, not merely identical SHAs.
    concurrency:
      group: pr-browser-preview-comment-${{ needs.resolve.outputs.number }}
      cancel-in-progress: false
    steps:
      - name: Check out trusted comment handler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Update the comment after revalidating the PR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREVIEW_RUN_ID: ${{ github.event.workflow_run.id }}
          EXPECTED_PR_NUMBER: ${{ needs.resolve.outputs.number }}
        run: node .github/scripts/comment-preview.mjs
